name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: frontend

      - name: Build with Next.js
        run: npx next build
        working-directory: frontend
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: https://fjftzqywrjorpfckdpiv.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZqZnR6cXl3cmpvcnBmY2tkcGl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NDYwMTQsImV4cCI6MjEwMzIyMjAxNH0.2NR4B2FFA-XDRXT0KXYaBzikfp3zJ8AOf18OUPZYCFc

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
